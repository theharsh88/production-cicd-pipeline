name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Black format check
        run: black --check .
      - name: MyPy type check
        run: mypy app
      - name: Unit tests and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Build candidate image
        run: docker build --tag taskflow-api:pr-${{ github.event.pull_request.number }} .
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskflow-api:pr-${{ github.event.pull_request.number }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Optional validation notification
        if: always() && github.event.pull_request.head.repo.fork == false && secrets.SLACK_WEBHOOK_URL != ''
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
        run: >-
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json'
          --data "{\"text\":\"TaskFlow PR validation: ${RESULT}\"}" "$WEBHOOK" || true
