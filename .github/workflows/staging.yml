name: Deploy staging

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: 'Immutable GHCR image reference ending in @sha256:...'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy exact CI image and verify it
        env:
          IMAGE: ${{ inputs.image }}
        run: bash scripts/deploy_compose.sh staging "$IMAGE"
      - name: Optional deployment notification
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
        run: >-
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json'
          --data "{\"text\":\"TaskFlow staging deployment: ${RESULT}\"}" "$WEBHOOK" || true
