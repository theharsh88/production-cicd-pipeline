name: Main CI and image publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-ci
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/taskflow-api

jobs:
  quality-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - run: pip-audit -r requirements.txt
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  build-push:
    needs: quality-security
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Publish immutable deployment reference
        id: image
        run: echo "image=${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Scan pushed image by digest
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy-staging:
    needs: build-push
    uses: ./.github/workflows/staging.yml
    with:
      image: ${{ needs.build-push.outputs.image }}
    secrets: inherit

  notify:
    needs: [quality-security, build-push, deploy-staging]
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Optional CI notification
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
        run: >-
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json'
          --data "{\"text\":\"TaskFlow main CI: ${RESULT}\"}" "$WEBHOOK" || true
