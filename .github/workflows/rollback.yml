name: Emergency rollback

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why is this rollback being run?'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Roll back to recorded known-good image
        run: bash scripts/rollback.sh
      - name: Optional rollback notification
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          REASON: ${{ inputs.reason }}
        run: >-
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json'
          --data "{\"text\":\"TaskFlow rollback (${RESULT}): ${REASON}\"}" "$WEBHOOK" || true
