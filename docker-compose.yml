services:
  taskflow:
    build:
      context: .
    image: taskflow-api:local
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: sqlite:////data/taskflow.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIMULATE_FAILURE: ${SIMULATE_FAILURE:-false}
    volumes:
      - taskflow_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  taskflow_data:
